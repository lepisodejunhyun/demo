<app-page-header title="약관 및 정책" description="서비스 이용에 관한 약관과 정책을 확인하세요." />

<app-content-wrapper>
    <!-- Tabs -->
    <app-tab-nav [items]="tabItems()" [activeId]="selectedId()" (tabChange)="selectTab($event)" />

    <!-- Selected Terms Content -->
    @if (selectedTerms(); as terms) {
    <div class="mt-8">
        <h2 class="text-2xl font-bold text-on-surface mb-6">{{ terms.title }}</h2>
        <div class="prose prose-slate max-w-none text-on-surface-variant text-sm leading-relaxed whitespace-pre-wrap">
            {{ terms.content }}
        </div>
    </div>
    } @else {
    <div class="mt-8 text-center text-on-surface-variant py-12">
        약관을 선택해주세요.
    </div>
    }
</app-content-wrapper>
