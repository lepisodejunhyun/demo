<div>
    <label class="block font-semibold text-xs text-on-surface-variant mb-2" [attr.for]="for() || null">
        {{ label() }}
        @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
        }
    </label>
    <ng-content />
    @if (showError) {
    <p class="text-error text-xs mt-1">필수 입력 항목입니다.</p>
    }
</div>
