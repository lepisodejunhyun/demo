<app-page-header title="갤러리" description="행사의 생생한 현장을 사진으로 만나보세요." />

<app-content-wrapper>
  <app-card-grid [isEmpty]="galleries().length === 0" emptyIcon="collections" emptyMessage="등록된 갤러리가 없습니다.">
    @for (item of galleries(); track item.id) {
    <app-image-card (click)="goDetail(item)" [imageUrl]="item.thumbnailUrl" fallbackIcon="image" [alt]="item.title">
      <h3 class="font-bold text-lg text-slate-900 line-clamp-1 break-all group-hover:text-primary transition-colors">{{
        item.title }}</h3>
      <p class="text-sm text-slate-500 mt-1">{{ item.createdAt | date: 'yyyy.MM.dd' }}</p>
    </app-image-card>
    }
  </app-card-grid>

  <app-pagination [pageInfo]="pageInfo()" (pageChange)="onPageChange($event)" />
</app-content-wrapper>
