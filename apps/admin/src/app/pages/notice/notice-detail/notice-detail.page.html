@if (notice) {
<app-detail-layout [breadcrumbs]="breadcrumbs" [title]="notice.title" [createdAt]="notice.createdAt"
    [updatedAt]="notice.updatedAt" backLink="/notice" [editLink]="'/notice/' + notice.id + '/edit'"
    (delete)="onDelete()">

    <div class="whitespace-pre-wrap">{{ notice.content }}</div>

</app-detail-layout>
}
