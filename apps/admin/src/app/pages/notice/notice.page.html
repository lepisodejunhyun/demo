<app-page-header title="공지사항 관리">
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-1">
        공지사항을 관리합니다.
    </p>
    <app-button slot="actions" variant="primary" icon="add" label="등록" link="/notice/create" />
</app-page-header>

<app-data-table [columns]="columns" [items]="notices()" [pageInfo]="pageInfo()" emptyMessage="등록된 공지사항이 없습니다."
    (rowClick)="goDetail($event)" (pageChange)="onPageChange($event)" />
