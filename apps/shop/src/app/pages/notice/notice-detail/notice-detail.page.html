<app-content-wrapper>
  <app-back-button (back)="goBack()" />

  @if (notice(); as notice) {
  <app-article-view [title]="notice.title" [createdAt]="notice.createdAt">
    <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap break-words">
      {{ notice.content }}
    </div>
  </app-article-view>
  } @else {
  <app-loading-spinner message="공지사항을 불러오는 중입니다..." />
  }
</app-content-wrapper>
