@if (terms()) {
<app-page-header [title]="terms()!.title">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <app-button slot="actions" variant="ghost-primary" icon="edit" label="수정" [link]="'/terms/' + terms()!.id + '/edit'" />
    <app-button slot="actions" variant="ghost-error" icon="delete" label="삭제" (action)="onDelete()" />
</app-page-header>

<app-detail-view [createdAt]="terms()!.createdAt" [updatedAt]="terms()!.updatedAt">
    <div class="mb-6">
        <app-status-badge
            [label]="terms()!.isRequired ? '필수 약관' : '선택 약관'"
            [variant]="terms()!.isRequired ? 'error' : 'neutral'"
            [icon]="terms()!.isRequired ? 'lock' : 'lock_open'" />
    </div>
    <div class="whitespace-pre-wrap">{{ terms()!.content }}</div>
</app-detail-view>
}
