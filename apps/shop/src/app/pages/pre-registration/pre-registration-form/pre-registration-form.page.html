<!-- Page Header -->
<section class="bg-surface-container-low/50 py-16 mt-16">
    <div class="max-w-[900px] mx-auto px-5 md:px-16">
        <h1 class="text-4xl font-extrabold text-on-surface tracking-tight">사전 등록 신청</h1>
        <p class="text-lg text-on-surface-variant mt-3">신청 정보를 입력하고 약관에 동의해주세요.</p>
    </div>
</section>

<!-- Content -->
<section class="max-w-[900px] mx-auto px-5 md:px-16 py-10">

    <!-- 로딩 -->
    <div *ngIf="!event" class="flex flex-col items-center justify-center py-20 text-on-surface-variant">
        <span class="material-symbols-outlined animate-spin text-4xl mb-4">autorenew</span>
        <p>행사 정보를 불러오는 중입니다...</p>
    </div>

    <div *ngIf="event" class="space-y-8">

        <!-- 선택한 행사 정보 -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6">
            <p class="text-xs font-bold text-primary uppercase tracking-wider mb-2">선택한 행사</p>
            <h2 class="text-xl font-bold text-on-surface">{{ event.title }}</h2>
            <p class="text-sm text-on-surface-variant mt-1">
                {{ event.startDate | date:'yyyy.MM.dd' }} ~ {{ event.endDate | date:'yyyy.MM.dd' }}
            </p>
        </div>

        <!-- 신청 정보 입력 -->
        <div class="space-y-6">
            <div>
                <label for="applicantName" class="block text-sm font-semibold text-on-surface mb-2">
                    신청자 이름 <span class="text-error">*</span>
                </label>
                <input id="applicantName" type="text" [(ngModel)]="applicantName" placeholder="이름을 입력하세요" maxlength="20"
                    class="w-full px-4 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" />
            </div>

            <div>
                <label for="contactNumber" class="block text-sm font-semibold text-on-surface mb-2">
                    연락처 <span class="text-error">*</span>
                </label>
                <input id="contactNumber" type="tel" [(ngModel)]="contactNumber" (input)="onPhoneInput($event)"
                    placeholder="010-0000-0000" maxlength="13"
                    class="w-full px-4 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" />
            </div>
        </div>

        <!-- 약관 동의 -->
        <div *ngIf="terms.length > 0">
            <h3 class="text-sm font-semibold text-on-surface mb-4">약관 동의</h3>

            <div class="space-y-3">
                <div *ngFor="let term of terms" class="border border-outline-variant rounded-xl overflow-hidden">
                    <div class="flex items-center justify-between px-4 py-3">
                        <label class="flex items-center gap-3 cursor-pointer flex-1">
                            <input type="checkbox" [checked]="isTermsAgreed(term.id)" (change)="toggleTerms(term.id)"
                                class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" />
                            <span class="text-sm text-on-surface">{{ term.title }}</span>
                            <span *ngIf="term.isRequired"
                                class="text-[10px] font-bold text-error bg-error/10 px-1.5 py-0.5 rounded">필수</span>
                            <span *ngIf="!term.isRequired"
                                class="text-[10px] font-bold text-on-surface-variant bg-surface-container-low px-1.5 py-0.5 rounded">선택</span>
                        </label>
                        <button (click)="toggleExpandTerms(term.id)"
                            class="text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer">
                            <span class="material-symbols-outlined text-lg">
                                {{ expandedTermsId === term.id ? 'expand_less' : 'expand_more' }}
                            </span>
                        </button>
                    </div>
                    <div *ngIf="expandedTermsId === term.id"
                        class="px-4 py-3 bg-surface-container-low border-t border-outline-variant text-xs text-on-surface-variant leading-relaxed whitespace-pre-wrap max-h-40 overflow-y-auto">
                        {{ term.content }}
                    </div>
                </div>
            </div>
        </div>

        @if (errorMessage) {
        <p class="text-error text-sm">{{ errorMessage }}</p>
        }

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-4">
            <button type="button" (click)="goBack()"
                class="px-6 py-3 text-sm font-semibold text-on-surface-variant border border-outline-variant rounded-xl hover:bg-surface-container transition-colors cursor-pointer">
                취소
            </button>
            <button type="button" (click)="submit()" [disabled]="loading"
                class="px-8 py-3 bg-gradient-to-r from-[#8127cf] to-[#4648d4] text-white text-sm font-bold rounded-xl hover:brightness-110 transition-all shadow-lg shadow-primary/20 cursor-pointer tracking-wider uppercase disabled:opacity-50 disabled:cursor-not-allowed">
                {{ loading ? '등록 중...' : '사전 등록하기' }}
            </button>
        </div>
    </div>

</section>
