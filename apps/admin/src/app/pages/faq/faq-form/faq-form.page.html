<app-page-header [title]="isEditMode ? 'FAQ 수정' : 'FAQ 작성'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs()" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? 'FAQ 내용을 수정합니다.' : '새로운 FAQ를 작성하여 팀원들과 공유하세요.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()" (submit)="onSubmit()">
    <app-form-field label="질문" for="faq-question" [required]="true" [control]="form.controls.question">
        <app-form-input formControlName="question" id="faq-question" [maxlength]="100" placeholder="질문을 입력하세요" />
    </app-form-field>

    <app-form-field label="답변" for="faq-answer" [required]="true" [control]="form.controls.answer">
        <app-form-textarea formControlName="answer" id="faq-answer" [rows]="16" [maxlength]="2000"
            placeholder="답변을 입력하세요" />
    </app-form-field>

    @if (errorMessage()) {
    <p class="text-error text-sm">{{ errorMessage() }}</p>
    }
</app-form-view>
