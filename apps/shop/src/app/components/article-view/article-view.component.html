<ng-content select="[slot=hero]" />

<article class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
  <header class="px-8 py-8 border-b border-slate-200 bg-slate-50/50">
    <div class="flex items-center gap-3 mb-4">
      <ng-content select="[slot=badges]" />
    </div>

    <div class="flex items-start justify-between gap-4">
      <h1 class="min-w-0 text-3xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4 break-words">
        {{ title() }}
      </h1>
      <ng-content select="[slot=header-actions]" />
    </div>

    <div class="flex items-center text-sm text-slate-500">
      @if (createdAt()) {
      <span class="flex items-center">
        <span class="material-symbols-outlined text-base mr-1.5">calendar_today</span>
        {{ createdAt() | date:'yyyy.MM.dd HH:mm' }}
      </span>
      }
    </div>

    <ng-content select="[slot=header-extra]" />
  </header>

  <div class="px-8 py-10 min-h-[300px]">
    <ng-content />
  </div>

  <ng-content select="[slot=footer]" />
</article>
