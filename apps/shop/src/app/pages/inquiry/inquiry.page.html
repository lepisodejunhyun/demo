<app-content-wrapper>
    <div class="flex items-center justify-between mb-6">
        <p class="text-sm text-on-surface-variant">총 <span class="font-semibold text-on-surface">{{
                pageInfo()?.totalItems
                || 0 }}건</span></p>
        <a routerLink="/support/inquiry/form"
            class="px-8 py-3 bg-gradient-to-r from-[#8127cf] to-[#4648d4] text-white text-sm font-bold rounded-xl hover:brightness-110 transition-all shadow-lg shadow-primary/20 cursor-pointer tracking-wider uppercase flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[18px]">edit</span>
            문의 작성
        </a>
    </div>

    <div class="space-y-3">
        @for (item of inquiries(); track item.id) {
        <a [routerLink]="['/support/inquiry', item.id]"
            class="block bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-5 hover:shadow-md hover:border-primary/20 transition-all cursor-pointer">
            <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-on-surface text-sm truncate">{{ item.title }}</h3>
                    <p class="text-xs text-outline mt-1.5">{{ item.createdAt | date:'yyyy.MM.dd HH:mm' }}</p>
                </div>
                <span class="shrink-0 px-3 py-1 text-xs font-semibold rounded-full"
                    [ngClass]="getStatusStyle(item.status)">
                    {{ statusLabels[item.status] }}
                </span>
            </div>
        </a>
        } @empty {
        <app-empty-state icon="inbox" message="등록된 문의가 없습니다.">
            <a routerLink="/support/inquiry/form"
                class="inline-block mt-4 px-5 py-2.5 bg-primary text-on-primary text-sm font-semibold rounded-full hover:brightness-110 transition-all">
                첫 문의 작성하기
            </a>
        </app-empty-state>
        }
    </div>

    <app-pagination [pageInfo]="pageInfo()" (pageChange)="onPageChange($event)" />
</app-content-wrapper>
