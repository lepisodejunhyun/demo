<div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-12">
  <div class="mb-10 text-center">
    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">갤러리</h1>
    <p class="mt-4 text-lg text-slate-500">행사의 생생한 현장을 사진으로 만나보세요.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <div *ngFor="let item of galleries" 
         (click)="goDetail(item)"
         class="group overflow-hidden cursor-pointer">
      
      <!-- 이미지 영역 -->
      <div class="aspect-[4/3] overflow-hidden bg-slate-100 mb-4">
        <img *ngIf="item.thumbnailUrl" [src]="item.thumbnailUrl" [alt]="item.title"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        
        <!-- 이미지가 없을 때 기본 뷰 -->
        <div *ngIf="!item.thumbnailUrl" class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 text-slate-400 group-hover:scale-105 transition-transform duration-500">
          <span class="material-symbols-outlined text-5xl mb-2 opacity-50">image</span>
          <span class="text-xs font-medium uppercase tracking-widest opacity-50">No Image</span>
        </div>
      </div>

      <!-- 정보 영역 -->
      <div>
        <h3 class="font-bold text-lg text-slate-900 line-clamp-1 group-hover:text-primary transition-colors">{{ item.title }}</h3>
        <p class="text-sm text-slate-500 mt-1">{{ item.createdAt | date: 'yyyy.MM.dd' }}</p>
      </div>
    </div>
    
    <!-- 빈 상태 -->
    <div *ngIf="galleries.length === 0" class="col-span-full py-20 text-center text-slate-500">
      <div class="flex flex-col items-center gap-3">
        <span class="material-symbols-outlined text-5xl opacity-50">collections</span>
        <p class="text-sm">등록된 갤러리가 없습니다.</p>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div *ngIf="pageInfo && pageInfo.totalPages > 1" class="mt-12 flex justify-center">
    <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
      <button 
        [disabled]="pageInfo.page <= 1"
        (click)="onPageChange(pageInfo.page - 1)"
        class="relative inline-flex items-center rounded-l-md px-3 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        <span class="sr-only">Previous</span>
        <span class="material-symbols-outlined text-sm">chevron_left</span>
      </button>
      
      <span class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-slate-900 ring-1 ring-inset ring-slate-300">
        {{ pageInfo.page }} / {{ pageInfo.totalPages }}
      </span>

      <button 
        [disabled]="pageInfo.page >= pageInfo.totalPages"
        (click)="onPageChange(pageInfo.page + 1)"
        class="relative inline-flex items-center rounded-r-md px-3 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        <span class="sr-only">Next</span>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
      </button>
    </nav>
  </div>
</div>
