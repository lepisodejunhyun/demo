<app-page-header [title]="isEditMode ? '사전 등록 수정' : '사전 등록'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? '사전 등록 정보를 수정합니다.' : '행사를 선택하고 신청자 정보를 입력하여 사전 등록합니다.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()"
    (submit)="onSubmit()">

    <app-form-field label="행사" for="pre-reg-event" [required]="true">
        <select formControlName="eventId" id="pre-reg-event"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all bg-white disabled:bg-surface-container-low disabled:text-on-surface-variant">
            <option value="" disabled>행사를 선택하세요</option>
            @for (event of availableEvents; track event.id) {
            <option [value]="event.id">{{ event.title }}</option>
            }
        </select>
        @if (isEditMode) {
        <p class="text-xs text-on-surface-variant mt-1">행사는 변경할 수 없습니다.</p>
        }
    </app-form-field>

    <app-form-field label="신청자 이름" for="pre-reg-name" [required]="true">
        <input formControlName="applicantName" id="pre-reg-name" type="text" maxlength="20"
            placeholder="신청자 이름을 입력하세요"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
    </app-form-field>

    <app-form-field label="연락처" for="pre-reg-contact" [required]="true">
        <input formControlName="contactNumber" id="pre-reg-contact" type="text" maxlength="13"
            placeholder="연락처를 입력하세요" (input)="onPhoneInput($event)"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
    </app-form-field>

    @if (errorMessage) {
    <p class="text-error text-sm">{{ errorMessage }}</p>
    }
</app-form-view>
