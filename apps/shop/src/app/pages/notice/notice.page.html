<app-content-wrapper>
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200">
      <tbody class="divide-y divide-slate-200 bg-white">
        @for (notice of notices(); track notice.id) {
        <tr (click)="goDetail(notice)" class="hover:bg-slate-50 cursor-pointer transition-colors duration-150">
          <td class="px-6 py-4 text-sm text-slate-900 font-medium max-w-0 w-full">
            <div class="line-clamp-1 break-all">{{ notice.title }}</div>
          </td>
          <td class="px-6 py-4 text-sm text-slate-500 text-right whitespace-nowrap">
            {{ notice.createdAt | date:'yyyy.MM.dd' }}
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="2" class="px-6 py-12 text-center text-slate-500 text-sm">
            등록된 공지사항이 없습니다.
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  <app-pagination [pageInfo]="pageInfo()" (pageChange)="onPageChange($event)" />
</app-content-wrapper>
