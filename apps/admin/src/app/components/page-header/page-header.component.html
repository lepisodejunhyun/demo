<div class="flex justify-between items-end mb-16">
    <div>
        <h2 class="text-[30px] leading-[38px] tracking-[-0.02em] font-bold text-on-surface mb-1">
            {{ title() }}
        </h2>
        @if (description()) {
        <p class="text-base leading-6 text-on-surface-variant">{{ description() }}</p>
        }
    </div>
    @if (buttonText() && buttonLink()) {
    <button [routerLink]="buttonLink()"
        class="bg-primary-container text-white px-6 py-2.5 rounded font-semibold text-xs flex items-center gap-2 hover:bg-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">add</span>
        {{ buttonText() }}
    </button>
    }
</div>
