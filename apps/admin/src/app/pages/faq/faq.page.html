<app-page-header title="FAQ 관리">
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-1">
        자주 묻는 질문을 관리합니다.
    </p>
    <app-button slot="actions" variant="primary" icon="add" label="등록" link="/faq/create" />
</app-page-header>

<app-data-table [columns]="columns" [items]="faqs()" [pageInfo]="pageInfo()" emptyMessage="등록된 FAQ가 없습니다."
    (rowClick)="goDetail($event)" (pageChange)="onPageChange($event)" />
