@if (faq) {
<app-detail-layout [breadcrumbs]="breadcrumbs" [title]="faq.question" [createdAt]="faq.createdAt"
    [updatedAt]="faq.updatedAt" backLink="/faq" [editLink]="'/faq/' + faq.id + '/edit'" (delete)="onDelete()">

    <div class="whitespace-pre-wrap">{{ faq.answer }}</div>

</app-detail-layout>
}
