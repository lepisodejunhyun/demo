<app-page-header [title]="isEditMode ? '약관 수정' : '약관 작성'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? '약관 내용을 수정합니다.' : '새로운 약관을 작성합니다.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()" (submit)="onSubmit()">
    <app-form-field label="제목" for="terms-title" [required]="true">
        <app-form-input formControlName="title" id="terms-title" [maxlength]="100" placeholder="제목을 입력하세요" />
    </app-form-field>

    <app-form-field label="내용" for="terms-content" [required]="true">
        <app-form-textarea formControlName="content" id="terms-content" [rows]="16" [maxlength]="10000"
            placeholder="내용을 입력하세요" />
    </app-form-field>

    <app-form-field label="필수 여부" for="terms-isRequired">
        <div class="flex items-center gap-3">
            <label class="relative inline-flex items-center cursor-pointer">
                <input formControlName="isRequired" id="terms-isRequired" type="checkbox" class="sr-only peer" />
                <div class="w-11 h-6 bg-outline-variant rounded-full peer-checked:bg-primary transition-colors
                            after:content-[''] after:absolute after:top-[2px] after:start-[2px]
                            after:bg-white after:rounded-full after:h-5 after:w-5
                            after:transition-all peer-checked:after:translate-x-full"></div>
            </label>
            <span class="text-sm" [class.text-primary]="form.get('isRequired')?.value"
                [class.text-on-surface-variant]="!form.get('isRequired')?.value">
                {{ form.get('isRequired')?.value ? '필수 약관' : '선택 약관' }}
            </span>
        </div>
    </app-form-field>

    @if (errorMessage() ) {
    <p class="text-error text-sm">{{ errorMessage() }}</p>
    }
</app-form-view>
