<app-content-wrapper padding="pt-28 pb-12">
  <app-back-button (back)="goBack()" />

  @if (gallery(); as gallery) {
  <app-article-view [title]="gallery.title" [createdAt]="gallery.createdAt">
    @if (gallery.content) {
    <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap break-words mb-10">
      {{ gallery.content }}
    </div>
    }

    @if (gallery.images && gallery.images.length > 0) {
    <div class="space-y-6">
      @for (image of gallery.images; track image.id) {
      <div class="w-full overflow-hidden bg-slate-100 flex justify-center items-center">
        <img [src]="image.url" alt="갤러리 이미지" class="max-w-full h-auto object-contain shadow-sm" />
      </div>
      }
    </div>
    }
  </app-article-view>
  } @else {
  <app-loading-spinner message="갤러리 정보를 불러오는 중입니다..." />
  }
</app-content-wrapper>
