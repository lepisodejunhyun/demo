<div class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-6 font-inter">
    <div class="w-full max-w-[440px] flex flex-col items-center">

        <!-- 브랜드 헤더 -->
        <div class="flex items-center gap-1 mb-6">
            <span class="material-symbols-outlined text-primary text-[32px] [font-variation-settings:'FILL'_1]">shield_locked</span>
            <span class="text-2xl font-semibold text-primary">관리자 페이지</span>
        </div>

        <!-- 로그인 카드 -->
        <div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">

            <!-- 타이틀 -->
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-semibold text-on-surface mb-1">관리자 로그인</h1>
                <p class="text-sm text-on-surface-variant">관리자 계정 정보를 입력해주세요.</p>
            </div>

            <!-- 로그인 폼 -->
            <form [formGroup]="form" class="flex flex-col gap-6">

                <!-- 이메일 -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-on-surface" for="email">이메일</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline">mail</span>
                        </div>
                        <input id="email" type="email" formControlName="email" (keydown)="keydownHandler($event)"
                            maxlength="40" placeholder="이메일을 입력해주세요."
                            class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg text-sm text-on-surface bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-all placeholder:text-outline-variant" />
                    </div>
                </div>

                <!-- 비밀번호 -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-on-surface" for="password">비밀번호</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline">lock</span>
                        </div>
                        <input id="password" type="password" formControlName="password" maxlength="16"
                            (keydown)="keydownHandler($event)" placeholder="비밀번호를 입력해주세요."
                            class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg text-sm text-on-surface bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-all placeholder:text-outline-variant" />
                    </div>
                </div>

                <!-- 에러 메시지 -->
                @if (errorMessage) {
                <p class="text-sm text-error">{{ errorMessage }}</p>
                }

                <!-- 로그인 버튼 -->
                <button type="button" [disabled]="form.invalid" (click)="submit()"
                    class="w-full flex justify-center items-center gap-1 py-3 px-4 rounded-lg text-xs font-semibold text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined text-[18px]">login</span>
                    로그인
                </button>
            </form>

            <!-- 하단 안내 -->
            <div class="mt-6 pt-3 border-t border-outline-variant text-center">
                <p class="text-xs text-outline">인가된 관리자만 접근할 수 있습니다.</p>
            </div>
        </div>
    </div>
</div>
