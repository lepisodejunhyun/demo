<nav class="w-[280px] h-screen bg-surface border-r border-outline-variant flex flex-col py-6 shrink-0">
    <!-- 브랜드 -->
    <div class="px-6 mb-6 flex flex-col gap-1">
        <h1 class="text-2xl font-bold text-primary">관리자</h1>
        <p class="text-xs font-semibold text-on-surface-variant">Enterprise Console</p>
    </div>

    <!-- 메인 메뉴 -->
    <div class="flex-1 flex flex-col">
        @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path"
            routerLinkActive="border-l-4 border-primary bg-secondary-container text-primary font-bold"
            class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-all">
            <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
        </a>
        }

    </div>

    <!-- 하단 메뉴 -->
    <div class="flex flex-col mt-auto">
        <a routerLink="/settings" routerLinkActive="text-primary font-bold"
            class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-all">
            <span class="material-symbols-outlined text-[20px]">settings</span>
            <span>설정</span>
        </a>
        <button (click)="logout()"
            class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-all w-full">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            <span>로그아웃</span>
        </button>
    </div>
</nav>
