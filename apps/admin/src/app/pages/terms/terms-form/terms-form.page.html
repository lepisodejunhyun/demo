<app-page-header [title]="isEditMode ? '약관 수정' : '약관 작성'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? '약관 내용을 수정합니다.' : '새로운 약관을 작성합니다.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()"
    (submit)="onSubmit()">
    <app-form-field label="제목" for="terms-title" [required]="true">
        <input formControlName="title" id="terms-title" type="text" maxlength="100" placeholder="제목을 입력하세요"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
    </app-form-field>

    <app-form-field label="내용" for="terms-content" [required]="true">
        <textarea formControlName="content" id="terms-content" rows="16" placeholder="내용을 입력하세요"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm transition-all placeholder:text-outline resize-none"></textarea>
    </app-form-field>

    @if (errorMessage) {
    <p class="text-error text-sm">{{ errorMessage }}</p>
    }
</app-form-view>
