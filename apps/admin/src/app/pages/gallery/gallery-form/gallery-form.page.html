<app-page-header [title]="isEditMode ? '갤러리 수정' : '갤러리 등록'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? '갤러리 내용을 수정합니다.' : '새로운 갤러리를 등록합니다.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()"
    (submit)="onSubmit()">

    <app-form-field label="제목" for="gallery-title" [required]="true">
        <input formControlName="title" id="gallery-title" type="text" maxlength="200" placeholder="제목을 입력하세요"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
    </app-form-field>

    <app-form-field label="내용" for="gallery-content">
        <textarea formControlName="content" id="gallery-content" rows="6" maxlength="5000" placeholder="내용을 입력하세요"
            class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm transition-all placeholder:text-outline resize-none"></textarea>
    </app-form-field>

    <app-form-field label="이미지" for="gallery-images" [required]="true">
        <!-- 이미지 미리보기 그리드 -->
        @if (imageItems.length > 0) {
        <div class="grid grid-cols-5 gap-3 mb-4">
            @for (item of imageItems; track $index) {
            <div class="relative aspect-[4/3] overflow-hidden bg-surface-container group">
                <img [src]="item.url" alt="미리보기" class="w-full h-full object-cover" />
                <button (click)="removeImage($index)" type="button"
                    class="absolute top-1 right-1 w-6 h-6 bg-black/60 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                    <span class="material-symbols-outlined text-[14px]">close</span>
                </button>
            </div>
            }
        </div>
        }

        <!-- 업로드 버튼 -->
        <div class="flex items-center gap-3">
            <label for="gallery-images"
                class="inline-flex items-center gap-2 px-4 py-2.5 bg-surface-container-highest text-on-surface rounded font-medium text-sm cursor-pointer hover:bg-outline-variant transition-colors">
                <span class="material-symbols-outlined text-[18px]">upload</span>
                이미지 선택
            </label>
            <input id="gallery-images" type="file" accept="image/*" multiple (change)="onFilesSelected($event)"
                class="hidden" />
            <p class="text-xs text-outline">JPG, PNG, WebP ({{ imageItems.length }}/{{ maxImages }}장)</p>
        </div>

        @if (uploading) {
        <p class="text-sm text-primary font-medium flex items-center gap-1 mt-3">
            <span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span>
            업로드 중...
        </p>
        }
    </app-form-field>

    @if (errorMessage) {
    <p class="text-error text-sm">{{ errorMessage }}</p>
    }
</app-form-view>
