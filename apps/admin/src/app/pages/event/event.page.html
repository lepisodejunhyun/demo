<app-page-header title="행사 관리">
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-1">
        행사 정보를 관리합니다.
    </p>
    <app-button slot="actions" variant="primary" icon="add" label="등록" link="/event/create" />
</app-page-header>

<app-data-table [columns]="columns" [items]="events()" [pageInfo]="pageInfo()" emptyMessage="등록된 행사가 없습니다."
    (rowClick)="goDetail($event)" (pageChange)="onPageChange($event)" />
