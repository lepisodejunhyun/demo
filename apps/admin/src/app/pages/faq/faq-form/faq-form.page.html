<!-- Page Header -->
<div class="mb-8 flex items-center justify-between">
    <div>
        <h2 class="text-[30px] leading-[38px] tracking-[-0.02em] font-bold text-on-surface">
            {{ isEditMode ? 'FAQ 수정' : 'FAQ 작성' }}
        </h2>
        <p class="text-sm text-on-surface-variant mt-1">
            {{ isEditMode ? 'FAQ를 수정합니다.' : '새로운 FAQ를 작성하여 팀원들과 공유하세요.' }}
        </p>
    </div>
</div>

<!-- Form -->
<div class="bg-surface-container-lowest border border-outline-variant rounded p-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Question -->
        <div>
            <label class="block font-semibold text-xs text-on-surface-variant mb-1" for="faq-question">
                질문
            </label>
            <input formControlName="question" id="faq-question" type="text" maxlength="200" placeholder="질문을 입력하세요"
                class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
        </div>

        <!-- Answer -->
        <div>
            <label class="block font-semibold text-xs text-on-surface-variant mb-1" for="faq-answer">
                답변
            </label>
            <textarea formControlName="answer" id="faq-answer" rows="16" maxlength="5000" placeholder="답변을 입력하세요"
                class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm transition-all placeholder:text-outline resize-none"></textarea>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
        <p class="text-error text-sm">{{ errorMessage }}</p>
        }

        <!-- Actions -->
        <div class="pt-4 flex items-center justify-end gap-3 border-t border-outline-variant">
            <button type="button" (click)="goBack()"
                class="px-6 py-2.5 rounded border border-outline-variant text-secondary font-semibold text-xs hover:bg-surface-container-low transition-colors cursor-pointer">
                취소
            </button>
            <button type="submit"
                class="px-6 py-2.5 rounded bg-primary-container text-white font-semibold text-xs hover:opacity-90 active:scale-[0.98] transition-all cursor-pointer">
                {{ isEditMode ? '수정하기' : '등록하기' }}
            </button>
        </div>
    </form>
</div>
