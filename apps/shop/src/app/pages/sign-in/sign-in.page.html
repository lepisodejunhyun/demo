<div class="min-h-screen bg-gradient-to-br from-[#4648d4] to-[#8127cf] flex items-center justify-center px-5 py-12">
    <!-- Background Effects -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-[#ddb7ff]/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a routerLink="/" class="inline-block text-3xl font-bold text-white tracking-tight">DEMO</a>
            <p class="text-sm text-white/60 mt-2">계정에 로그인하세요</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <!-- Email -->
                <div class="mb-5">
                    <label for="sign-in-email" class="block text-sm font-semibold text-on-surface mb-2">이메일</label>
                    <input formControlName="email" id="sign-in-email" type="email" maxlength="40"
                        placeholder="example&#64;email.com"
                        class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" />
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="sign-in-password" class="block text-sm font-semibold text-on-surface mb-2">비밀번호</label>
                    <input formControlName="password" id="sign-in-password" type="password" maxlength="40"
                        placeholder="비밀번호를 입력하세요"
                        class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" />
                </div>

                @if (errorMessage) {
                <p class="text-error text-sm mb-4">{{ errorMessage }}</p>
                }

                <!-- Submit -->
                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-[#8127cf] to-[#4648d4] text-white font-bold text-sm rounded-xl hover:brightness-110 transition-all shadow-lg shadow-primary/30 cursor-pointer tracking-wider uppercase">
                    로그인
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-outline-variant"></div>
                <span class="text-xs text-outline">또는</span>
                <div class="flex-1 h-px bg-outline-variant"></div>
            </div>

            <!-- Kakao Login -->
            <button (click)="onKakaoLogin()"
                class="w-full py-3.5 bg-[#FEE500] text-[#3C1E1E] font-bold text-sm rounded-xl hover:bg-[#FDD835] transition-colors flex items-center justify-center gap-2 cursor-pointer">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path
                        d="M9 1C4.58 1 1 3.79 1 7.21c0 2.17 1.44 4.08 3.62 5.18l-.93 3.44c-.08.3.26.54.52.37l4.09-2.69c.23.02.46.03.7.03 4.42 0 8-2.79 8-6.23S13.42 1 9 1z"
                        fill="#3C1E1E" />
                </svg>
                카카오로 시작하기
            </button>

            <!-- Sign Up Link -->
            <p class="text-center text-sm text-on-surface-variant mt-6">
                아직 계정이 없으신가요?
                <a class="text-primary font-semibold hover:underline cursor-pointer">회원가입</a>
            </p>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a routerLink="/" class="text-sm text-white/60 hover:text-white transition-colors">
                ← 홈으로 돌아가기
            </a>
        </div>
    </div>
</div>
