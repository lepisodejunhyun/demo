<app-page-header title="갤러리 관리">
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-1">
        갤러리를 관리합니다.
    </p>
    <a slot="actions" routerLink="/gallery/create"
        class="bg-primary-container text-white px-6 py-2.5 rounded font-semibold text-xs flex items-center gap-2 hover:bg-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">add</span>
        등록
    </a>
</app-page-header>

<app-card-grid [items]="galleries()" [config]="config" [pageInfo]="pageInfo()" emptyMessage="등록된 갤러리가 없습니다."
    (rowClick)="goDetail($event)" (pageChange)="onPageChange($event)" />
