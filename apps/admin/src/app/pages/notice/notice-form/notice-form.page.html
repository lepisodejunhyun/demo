<app-form-layout [breadcrumbs]="breadcrumbs" [title]="isEditMode ? '공지사항 수정' : '공지사항 작성'"
    [description]="isEditMode ? '공지사항 내용을 수정합니다.' : '새로운 공지사항을 작성하여 팀원들과 공유하세요.'"
    [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()" (submit)="onSubmit()">

    <form [formGroup]="form" class="space-y-6">
        <!-- Title -->
        <div>
            <label class="block font-semibold text-xs text-on-surface-variant mb-2" for="notice-title">제목</label>
            <input formControlName="title" id="notice-title" type="text" maxlength="200" placeholder="제목을 입력하세요"
                class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base transition-all placeholder:text-outline" />
        </div>

        <!-- Content -->
        <div>
            <label class="block font-semibold text-xs text-on-surface-variant mb-2" for="notice-content">내용</label>
            <textarea formControlName="content" id="notice-content" rows="16" maxlength="5000" placeholder="내용을 입력하세요"
                class="w-full px-4 py-3 border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm transition-all placeholder:text-outline resize-none"></textarea>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
        <p class="text-error text-sm">{{ errorMessage }}</p>
        }
    </form>

</app-form-layout>
