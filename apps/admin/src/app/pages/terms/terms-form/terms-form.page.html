<app-page-header [title]="isEditMode ? '약관 수정' : '약관 작성'">
    <app-breadcrumb slot="breadcrumb" [items]="breadcrumbs" />
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-6">
        {{ isEditMode ? '약관 내용을 수정합니다.' : '새로운 약관을 작성합니다.' }}
    </p>
</app-page-header>

<app-form-view [formGroup]="form" [submitText]="isEditMode ? '수정하기' : '등록하기'" (cancel)="goBack()" (submit)="onSubmit()">
    <app-form-field label="제목" for="terms-title" [required]="true" [control]="form.controls.title">
        <app-form-input formControlName="title" id="terms-title" [maxlength]="100" placeholder="제목을 입력하세요" />
    </app-form-field>

    <app-form-field label="내용" for="terms-content" [required]="true" [control]="form.controls.content">
        <app-form-textarea formControlName="content" id="terms-content" [rows]="16" [maxlength]="10000"
            placeholder="내용을 입력하세요" />
    </app-form-field>

    <app-form-field label="필수 여부" for="terms-isRequired">
        <app-form-toggle
            formControlName="isRequired"
            labelOn="필수 약관"
            labelOff="선택 약관"
            inputId="terms-isRequired" />
    </app-form-field>

    @if (errorMessage() ) {
    <p class="text-error text-sm">{{ errorMessage() }}</p>
    }
</app-form-view>
