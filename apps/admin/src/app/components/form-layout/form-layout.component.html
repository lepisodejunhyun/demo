<div class="max-w-5xl mx-auto px-10 py-10">
    <!-- Breadcrumb -->
    <div class="flex justify-between items-center mb-12 h-10">
        <nav class="flex items-center gap-2 text-xs font-semibold text-on-surface-variant">
            @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
            @if (crumb.link) {
            <a [routerLink]="crumb.link" class="hover:text-primary transition-colors">{{ crumb.label }}</a>
            } @else {
            <span class="text-on-surface">{{ crumb.label }}</span>
            }
            @if (!last) {
            <span class="material-symbols-outlined text-[14px]">chevron_right</span>
            }
            }
        </nav>
    </div>

    <!-- Header -->
    <h2 class="text-[30px] leading-[38px] tracking-[-0.02em] font-bold text-on-surface mb-6">
        {{ title() }}
    </h2>
    @if (description()) {
    <p class="text-base leading-6 text-on-surface-variant mb-10">{{ description() }}</p>
    }

    <!-- Content (폼 필드 영역) -->
    <div class="border-t border-outline-variant pt-10">
        <ng-content />
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-8 mt-8 border-t border-outline-variant">
        <button type="button" (click)="onCancel()"
            class="px-6 py-2.5 rounded border border-outline-variant text-secondary font-semibold text-xs hover:bg-surface-container-low transition-colors cursor-pointer">
            취소
        </button>
        <button type="button" (click)="onSubmit()"
            class="px-6 py-2.5 rounded bg-primary-container text-white font-semibold text-xs hover:opacity-90 active:scale-[0.98] transition-all cursor-pointer">
            {{ submitText() }}
        </button>
    </div>
</div>
