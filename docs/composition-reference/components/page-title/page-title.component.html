<h2 class="text-[30px] leading-[38px] tracking-[-0.02em] font-bold text-on-surface mb-6">
    {{ title() }}
</h2>
@if (description()) {
<p class="text-base leading-6 text-on-surface-variant mb-10">{{ description() }}</p>
}
@if (createdAt() || updatedAt()) {
<div class="flex items-center gap-6 text-xs font-semibold text-on-surface-variant mb-10">
    @if (createdAt()) {
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">calendar_today</span>
        <span>{{ createdAt() | date:'yyyy.MM.dd HH:mm' }}</span>
    </div>
    }
    @if (updatedAt()) {
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">edit_calendar</span>
        <span>{{ updatedAt() | date:'yyyy.MM.dd HH:mm' }}</span>
    </div>
    }
</div>
}
