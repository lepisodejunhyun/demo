<app-page-header title="갤러리 관리">
    <p slot="description" class="text-base leading-6 text-on-surface-variant mt-1">
        갤러리를 관리합니다.
    </p>
    <app-button slot="actions" variant="primary" icon="add" label="등록" link="/gallery/create" />
</app-page-header>

<app-card-grid [items]="galleries()" [config]="config" [pageInfo]="pageInfo()" emptyMessage="등록된 갤러리가 없습니다."
    (rowClick)="goDetail($event)" (pageChange)="onPageChange($event)" />
