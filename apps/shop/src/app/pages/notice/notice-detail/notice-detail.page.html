<div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-12">
  <div class="mb-6 flex items-center justify-between">
    <button (click)="goBack()" class="flex items-center text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">
      <span class="material-symbols-outlined text-lg mr-1">arrow_back</span>
      목록으로
    </button>
  </div>

  <article *ngIf="notice" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
    <header class="px-8 py-8 border-b border-slate-200 bg-slate-50/50">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
        {{ notice.title }}
      </h1>
      <div class="flex items-center text-sm text-slate-500">
        <span class="flex items-center">
          <span class="material-symbols-outlined text-base mr-1.5">calendar_today</span>
          {{ notice.createdAt | date:'yyyy.MM.dd HH:mm' }}
        </span>
      </div>
    </header>
    
    <div class="px-8 py-10 min-h-[300px]">
      <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap">
        {{ notice.content }}
      </div>
    </div>
  </article>

  <!-- Loading State -->
  <div *ngIf="!notice" class="flex flex-col items-center justify-center min-h-[400px] text-slate-400">
    <span class="material-symbols-outlined animate-spin text-4xl mb-4">autorenew</span>
    <p>공지사항을 불러오는 중입니다...</p>
  </div>
</div>
