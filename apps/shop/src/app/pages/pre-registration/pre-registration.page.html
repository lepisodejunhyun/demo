<app-page-header title="사전 등록" description="사전 등록 가능한 행사를 선택하고, 간단한 정보를 입력하세요." />

<app-content-wrapper>
  <app-card-grid [isEmpty]="events().length === 0" emptyIcon="event_busy" emptyMessage="현재 사전 등록 가능한 행사가 없습니다.">
    @for (item of events(); track item.id) {
    <app-image-card (click)="selectEvent(item)" [imageUrl]="item.posterImage" fallbackIcon="how_to_reg" [alt]="item.title">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 text-[10px] font-bold tracking-wider uppercase bg-violet-100 text-violet-700">
          {{ getDday(item.preRegEndDate!) }}
        </span>
      </div>
      <h3 class="font-bold text-lg text-slate-900 line-clamp-1 break-all group-hover:text-primary transition-colors">{{
        item.title }}</h3>
      <p class="text-sm text-slate-500 mt-1">{{ item.startDate | date:'yyyy.MM.dd' }} ~ {{ item.endDate |
        date:'yyyy.MM.dd' }}</p>
      <p class="text-sm text-slate-400 mt-1">
        사전등록 마감: {{ item.preRegEndDate | date:'yyyy.MM.dd' }}
      </p>
      @if (item.location) {
      <p class="text-sm text-slate-400 mt-1 flex items-center gap-1 truncate">
        <span class="material-symbols-outlined text-sm shrink-0">location_on</span>
        <span class="truncate">{{ item.location }}</span>
      </p>
      }
    </app-image-card>
    }
  </app-card-grid>

  <app-pagination [pageInfo]="pageInfo()" (pageChange)="onPageChange($event)" />
</app-content-wrapper>
