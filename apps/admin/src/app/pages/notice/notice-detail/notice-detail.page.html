@if (notice) {
<!-- Breadcrumbs & Actions -->
<div class="mb-8 flex items-center justify-between">
    <nav class="flex items-center gap-2">
        <a routerLink="/notice" class="flex items-center gap-1 text-primary font-semibold text-xs hover:underline">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            목록으로
        </a>
    </nav>
    <div class="flex items-center gap-3">
        <button [routerLink]="['/notice', notice.id, 'edit']"
            class="px-4 py-2 bg-surface-container-lowest border border-outline-variant text-secondary font-semibold text-xs hover:bg-surface-container-low transition-colors flex items-center gap-2 rounded cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">edit</span>
            수정
        </button>
        <button (click)="onDelete()"
            class="px-4 py-2 bg-error text-on-error font-semibold text-xs hover:opacity-90 transition-colors flex items-center gap-2 rounded cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            삭제
        </button>
    </div>
</div>

<!-- Notice Detail -->
<div class="bg-surface-container-lowest border border-outline-variant p-8 rounded">
    <h2 class="text-[30px] leading-[38px] tracking-[-0.02em] font-bold text-on-surface mb-6">
        {{ notice.title }}
    </h2>
    <div class="text-base leading-relaxed text-on-surface-variant whitespace-pre-wrap">
        {{ notice.content }}
    </div>
</div>
}
